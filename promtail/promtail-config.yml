server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: "/(.*)"
        replacement: "$1"

    pipeline_stages:
      - json:
          expressions:
            tus_code: tus_code
            latency: latency
            client_ip: client_ip
            service: service
            env: env
            status_code: status_code
      - labels:
          tus_code:
          latency:
          client_ip:
          service:
          env:
          status_code:
